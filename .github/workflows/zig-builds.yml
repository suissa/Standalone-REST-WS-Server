name: Zig Build

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        targets:
          - x86_64-linux-gnu
          - x86-linux-gnu
          - aarch64-linux-gnu
          - aarch64-linux-musl
          - riscv64-linux-musl
          # - mipsel-linux-musl
          # - mips-linux-musl
          - powerpc64-linux-musl
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows
          - x86-windows
          - aarch64-windows

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: mlugg/setup-zig@v1
        with:
          version: master

      - name: Build Summary ${{ matrix.targets }}
        run: zig build -Dtests --summary all -freference-trace -Dtarget=${{ matrix.targets }}

  websocket-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: mlugg/setup-zig@v1
        with:
          version: master

      - name: Build WebSocket integration test
        run: zig build -Dtests -Dtarget=x86_64-linux-gnu --summary all

      - name: Run WebSocket communication test
        run: zig build -Dtests -Dtarget=x86_64-linux-gnu websocket_test --summary all
